{% extends "base.html" %}

{% block content %}
<div class="bg-gradient-to-tr from-rose-50/20 via-white to-rose-50/10 py-16 sm:py-24">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
        <!-- Content Card -->
        <div class="bg-white border border-rose-100/60 rounded-3xl shadow-premium overflow-hidden grid grid-cols-1 md:grid-cols-12">
            <!-- Sidebar info panel -->
            <div class="md:col-span-5 bg-gradient-to-br from-primary-800 to-rose-950 p-8 sm:p-10 text-white flex flex-col justify-between">
                <div>
                    <h2 class="text-3xl font-extrabold tracking-tight mb-4">Contact Us</h2>
                    <p class="text-rose-100/80 font-medium text-sm leading-relaxed mb-8">
                        Have questions about donating or organizing blood campaigns? Connect with us anytime.
                    </p>
                </div>
                
                <div class="space-y-6">
                    <div class="flex gap-4 items-center">
                        <div class="w-10 h-10 rounded-xl bg-white/10 flex items-center justify-center text-rose-200">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                            </svg>
                        </div>
                        <div>
                            <span class="block text-xs font-bold uppercase tracking-wider text-rose-200">Email Address</span>
                            <a href="mailto:support@lifelink.com" class="font-bold hover:underline text-sm">support@lifelink.com</a>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Form panel -->
            <div class="md:col-span-7 p-8 sm:p-10">
                <form class="space-y-6">
                    <div>
                        <label for="name" class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Name</label>
                        <input type="text" id="name" required
                            class="block w-full px-4 py-3 border border-rose-100/80 rounded-2xl placeholder-gray-400 text-gray-900 font-medium focus:outline-none focus:ring-4 focus:ring-primary-500/10 focus:border-primary-500 transition duration-150 sm:text-sm bg-rose-50/10"
                            placeholder="Your name">
                    </div>
                    <div>
                        <label for="email" class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Email</label>
                        <input type="email" id="email" required
                            class="block w-full px-4 py-3 border border-rose-100/80 rounded-2xl placeholder-gray-400 text-gray-900 font-medium focus:outline-none focus:ring-4 focus:ring-primary-500/10 focus:border-primary-500 transition duration-150 sm:text-sm bg-rose-50/10"
                            placeholder="name@example.com">
                    </div>
                    <div>
                        <label for="message" class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Message</label>
                        <textarea id="message" rows="4" required
                            class="block w-full px-4 py-3 border border-rose-100/80 rounded-2xl placeholder-gray-400 text-gray-900 font-medium focus:outline-none focus:ring-4 focus:ring-primary-500/10 focus:border-primary-500 transition duration-150 sm:text-sm bg-rose-50/10"
                            placeholder="Write your message here..."></textarea>
                    </div>
                    
                    <button type="submit" 
                        class="w-full flex justify-center py-3.5 px-4 border border-transparent text-sm font-bold rounded-2xl text-white bg-gradient-to-r from-primary-600 to-rose-500 hover:from-primary-700 hover:to-rose-600 shadow-premium hover:shadow-premium-hover transform hover:-translate-y-0.5 active:translate-y-0 transition duration-150 focus:outline-none focus:ring-4 focus:ring-primary-500/20">
                        Send Message
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
