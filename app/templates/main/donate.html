{% extends "base.html" %}

{% block content %}
<div class="bg-gradient-to-tr from-rose-50/20 via-white to-rose-50/10 py-16 sm:py-24 animate-fade-in">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <!-- Header -->
        <div class="text-center mb-16">
            <span class="text-primary-600 font-extrabold tracking-wider uppercase text-xs">Register Donation</span>
            <h2 class="text-3xl sm:text-5xl font-black text-slate-900 mt-2">
                Donate Blood
            </h2>
            <p class="mt-3 max-w-2xl mx-auto text-base text-gray-500 font-medium">
                Record your voluntary contribution and keep track of your active donations.
            </p>
        </div>

        <!-- Form Card -->
        <div class="max-w-2xl mx-auto bg-white border border-rose-100/60 rounded-3xl shadow-premium p-8 sm:p-10 relative overflow-hidden">
            <div class="absolute -right-24 -top-24 w-48 h-48 bg-primary-500/10 rounded-full blur-3xl"></div>
            
            <form action="{{ url_for('main.record_donation') }}" method="POST" class="space-y-6">
                <!-- Row -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                    <div>
                        <label for="blood_type" class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Blood Group</label>
                        <select id="blood_type" name="blood_type" required 
                            class="block w-full px-4 py-3 border border-rose-100/80 rounded-2xl text-gray-900 font-medium focus:outline-none focus:ring-4 focus:ring-primary-500/10 focus:border-primary-500 transition duration-150 sm:text-sm bg-rose-50/10">
                            <option value="">Select blood type</option>
                            {% for blood_type in ['A+', 'A-', 'B+', 'B-', 'AB+', 'AB-', 'O+', 'O-'] %}
                            <option value="{{ blood_type }}">{{ blood_type }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div>
                        <label for="units" class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Units Donated</label>
                        <input type="number" name="units" id="units" min="1" max="2" value="1" required 
                            class="block w-full px-4 py-3 border border-rose-100/80 rounded-2xl placeholder-gray-400 text-gray-900 font-medium focus:outline-none focus:ring-4 focus:ring-primary-500/10 focus:border-primary-500 transition duration-150 sm:text-sm bg-rose-50/10">
                    </div>
                </div>

                <!-- Date -->
                <div>
                    <label for="donation_date" class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Donation Date & Time</label>
                    <input type="datetime-local" name="donation_date" id="donation_date" required 
                        class="block w-full px-4 py-3 border border-rose-100/80 rounded-2xl text-gray-900 font-medium focus:outline-none focus:ring-4 focus:ring-primary-500/10 focus:border-primary-500 transition duration-150 sm:text-sm bg-rose-50/10">
                </div>

                <!-- Notes -->
                <div>
                    <label for="notes" class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Participant / Health Notes</label>
                    <textarea id="notes" name="notes" rows="3" 
                        class="block w-full px-4 py-3 border border-rose-100/80 rounded-2xl placeholder-gray-400 text-gray-900 font-medium focus:outline-none focus:ring-4 focus:ring-primary-500/10 focus:border-primary-500 transition duration-150 sm:text-sm bg-rose-50/10"
                        placeholder="Add any relevant information or questions..."></textarea>
                </div>

                <div>
                    <button type="submit" 
                        class="w-full flex justify-center py-3.5 px-4 border border-transparent text-sm font-bold rounded-2xl text-white bg-gradient-to-r from-primary-600 to-rose-500 hover:from-primary-700 hover:to-rose-600 shadow-premium hover:shadow-premium-hover transform hover:-translate-y-0.5 active:translate-y-0 transition duration-150 focus:outline-none focus:ring-4 focus:ring-primary-500/20">
                        Record Donation Application
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
