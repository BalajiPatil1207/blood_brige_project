{% extends "base.html" %}

{% block content %}
<div class="min-h-[80vh] flex flex-col justify-center items-center px-4 sm:px-6 lg:px-8 py-12 bg-gradient-to-tr from-rose-50/30 via-white to-rose-50/10">
    <div class="max-w-md w-full">
        <!-- Card Container -->
        <div class="bg-white border border-rose-100/60 rounded-3xl shadow-premium p-8 sm:p-10 transform hover:scale-[1.005] transition-all duration-300">
            <!-- Header -->
            <div class="text-center mb-8">
                <h2 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-slate-900 to-slate-700 tracking-tight">
                    Welcome Back
                </h2>
                <p class="mt-2.5 text-sm text-gray-500 font-medium">
                    New to LifeLink? 
                    <a href="{{ url_for('auth.register', user_type='donor') }}" class="font-bold text-primary-600 hover:text-primary-700 transition duration-150">
                        Create a free account
                    </a>
                </p>
            </div>

            <!-- Form -->
            <form class="space-y-6" action="{{ url_for('auth.login') }}" method="POST">
                <div class="space-y-5">
                    <div>
                        <label for="email" class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Email Address</label>
                        <div class="relative">
                            <input id="email" name="email" type="email" required 
                                class="block w-full px-4 py-3 border border-rose-100/80 rounded-2xl placeholder-gray-400 text-gray-900 font-medium focus:outline-none focus:ring-4 focus:ring-primary-500/10 focus:border-primary-500 transition duration-150 sm:text-sm bg-rose-50/10" 
                                placeholder="name@example.com">
                        </div>
                    </div>
                    <div>
                        <div class="flex justify-between items-center mb-2">
                            <label for="password" class="block text-xs font-bold text-gray-500 uppercase tracking-wider">Password</label>
                            <a href="#" class="text-xs font-bold text-primary-600 hover:text-primary-700 transition duration-150">
                                Forgot password?
                            </a>
                        </div>
                        <div class="relative">
                            <input id="password" name="password" type="password" required 
                                class="block w-full px-4 py-3 border border-rose-100/80 rounded-2xl placeholder-gray-400 text-gray-900 font-medium focus:outline-none focus:ring-4 focus:ring-primary-500/10 focus:border-primary-500 transition duration-150 sm:text-sm bg-rose-50/10" 
                                placeholder="••••••••">
                        </div>
                    </div>
                </div>

                <div class="flex items-center justify-between pt-1">
                    <div class="flex items-center">
                        <input id="remember_me" name="remember_me" type="checkbox" 
                            class="h-4.5 w-4.5 text-primary-600 focus:ring-primary-500 border-rose-200 rounded-lg cursor-pointer">
                        <label for="remember_me" class="ml-2.5 block text-sm text-gray-600 font-semibold cursor-pointer select-none">
                            Keep me signed in
                        </label>
                    </div>
                </div>

                <div>
                    <button type="submit" 
                        class="w-full flex justify-center py-3.5 px-4 border border-transparent text-sm font-bold rounded-2xl text-white bg-gradient-to-r from-primary-600 to-rose-500 hover:from-primary-700 hover:to-rose-600 shadow-premium hover:shadow-premium-hover transform hover:-translate-y-0.5 active:translate-y-0 transition duration-150 focus:outline-none focus:ring-4 focus:ring-primary-500/20">
                        Sign In
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
