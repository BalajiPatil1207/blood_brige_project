{% extends "base.html" %}

{% block content %}
<div class="min-h-[85vh] flex flex-col justify-center items-center px-4 sm:px-6 lg:px-8 py-12 bg-gradient-to-tr from-rose-50/30 via-white to-rose-50/10">
    <div class="max-w-xl w-full">
        <!-- Card Container -->
        <div class="bg-white border border-rose-100/60 rounded-3xl shadow-premium p-8 sm:p-10 transform hover:scale-[1.002] transition-all duration-300">
            <!-- Header -->
            <div class="text-center mb-8">
                <h2 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-slate-900 to-slate-700 tracking-tight">
                    Join LifeLink
                </h2>
                <p class="mt-2.5 text-sm text-gray-500 font-medium">
                    Already registered? 
                    <a href="{{ url_for('auth.login') }}" class="font-bold text-primary-600 hover:text-primary-700 transition duration-150">
                        Sign in to your account
                    </a>
                </p>
            </div>

            <!-- Form -->
            <form action="{{ url_for('auth.register', user_type='donor') }}" method="POST" class="space-y-6">
                <!-- Row: Name fields -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                    <div>
                        <label for="first_name" class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">First Name</label>
                        <input type="text" name="first_name" id="first_name" required 
                            class="block w-full px-4 py-3 border border-rose-100/80 rounded-2xl placeholder-gray-400 text-gray-900 font-medium focus:outline-none focus:ring-4 focus:ring-primary-500/10 focus:border-primary-500 transition duration-150 sm:text-sm bg-rose-50/10"
                            placeholder="John">
                    </div>
                    <div>
                        <label for="last_name" class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Last Name</label>
                        <input type="text" name="last_name" id="last_name" required 
                            class="block w-full px-4 py-3 border border-rose-100/80 rounded-2xl placeholder-gray-400 text-gray-900 font-medium focus:outline-none focus:ring-4 focus:ring-primary-500/10 focus:border-primary-500 transition duration-150 sm:text-sm bg-rose-50/10"
                            placeholder="Doe">
                    </div>
                </div>

                <!-- Email -->
                <div>
                    <label for="email" class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Email Address</label>
                    <input type="email" name="email" id="email" required 
                        class="block w-full px-4 py-3 border border-rose-100/80 rounded-2xl placeholder-gray-400 text-gray-900 font-medium focus:outline-none focus:ring-4 focus:ring-primary-500/10 focus:border-primary-500 transition duration-150 sm:text-sm bg-rose-50/10"
                        placeholder="john.doe@example.com">
                </div>

                <!-- Row: Password fields -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                    <div>
                        <label for="password" class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Password</label>
                        <input type="password" name="password" id="password" required 
                            class="block w-full px-4 py-3 border border-rose-100/80 rounded-2xl placeholder-gray-400 text-gray-900 font-medium focus:outline-none focus:ring-4 focus:ring-primary-500/10 focus:border-primary-500 transition duration-150 sm:text-sm bg-rose-50/10"
                            placeholder="••••••••">
                    </div>
                    <div>
                        <label for="confirm_password" class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Confirm Password</label>
                        <input type="password" name="confirm_password" id="confirm_password" required 
                            class="block w-full px-4 py-3 border border-rose-100/80 rounded-2xl placeholder-gray-400 text-gray-900 font-medium focus:outline-none focus:ring-4 focus:ring-primary-500/10 focus:border-primary-500 transition duration-150 sm:text-sm bg-rose-50/10"
                            placeholder="••••••••">
                    </div>
                </div>

                <!-- Blood Type -->
                <div>
                    <label for="blood_type" class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Blood Group</label>
                    <select id="blood_type" name="blood_type" required 
                        class="block w-full px-4 py-3 border border-rose-100/80 rounded-2xl text-gray-900 font-medium focus:outline-none focus:ring-4 focus:ring-primary-500/10 focus:border-primary-500 transition duration-150 sm:text-sm bg-rose-50/10">
                        <option value="">Select blood type</option>
                        {% for blood_type in ['A+', 'A-', 'B+', 'B-', 'AB+', 'AB-', 'O+', 'O-'] %}
                        <option value="{{ blood_type }}">{{ blood_type }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="pt-2">
                    <button type="submit" 
                        class="w-full flex justify-center py-3.5 px-4 border border-transparent text-sm font-bold rounded-2xl text-white bg-gradient-to-r from-primary-600 to-rose-500 hover:from-primary-700 hover:to-rose-600 shadow-premium hover:shadow-premium-hover transform hover:-translate-y-0.5 active:translate-y-0 transition duration-150 focus:outline-none focus:ring-4 focus:ring-primary-500/20">
                        Create Account
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
